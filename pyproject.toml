[project]
name = "parley"
version = "0.1.0"
description = "An n-party conversation format for one human chair and several AI agents in a shared repository: JSONL log, protocol, thin dispatcher."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["jsonschema>=3.2"]

[project.scripts]
parley = "parleylib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/parleylib"]

[tool.hatch.build.targets.sdist]
include = ["tools/parleylib", "schema", "PROTOCOL.md", "SCHEMA.md", "README.md", ".parley/participants.json"]
